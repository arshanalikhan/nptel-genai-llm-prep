<section id="repeated" class="page" hidden>
  <div class="wrap">
    <div class="sec-head">
      <p class="eyebrow">Must-know</p>
      <h2>The {{must_know_count}} ideas most likely to be tested</h2>
      <p>One card per core idea across the syllabus, written as an exam-style MCQ. Pick an answer to check it, then read the key idea underneath.</p>
    </div>
    <div class="actions">
      <div class="left">
        <button class="btn" id="repreveal" type="button" aria-pressed="false">Show all answers</button>
        <button class="btn" id="represet" type="button">Reset answers</button>
      </div>
      <p class="score" id="repcount"></p>
    </div>
    <div id="replist"></div>
  </div>
</section>
